<!DOCTYPE html>

<body>
    <header>
        <h1>SISTEMA DE AUTOMÓVILES</h1>

    <nav>
        <a href="consulta.html">Consultar</a>
        <a href="alta.html" class="activo">Agregar</a>
        <a href="modificar.html">Modificar</a>

    </nav>

    <form id="formAgregar">
        <label for="id">Id:</label>
        <input type="text" id="id" min="1" placeholder="Id">
        <label for="marca">Marca:</label>
        <input type="text" id="marca" placeholder="Marca" required><br>
        <label for="precio">Precio:</label>
        <input type="number" id="precio" min="1" placeholder="Precio" required><br>
        <label for="color">Color:</label>
        <input type="color" id="color" value="#000000" required><br>
        <br>
        <button type="submit">Agregar</button>
    </form>

    <script src="js/alta.js"></script>
